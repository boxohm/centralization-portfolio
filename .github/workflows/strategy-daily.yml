name: strategy-daily-data

on:
  schedule:
    - cron: "30 13-20 * * 1-5"  # hourly through the US session (13:30–20:30 UTC)
    - cron: "45 22 * * 1-5"     # 22:45 UTC weekdays, after US market close
  workflow_dispatch: {}

concurrency:
  group: strategy-daily
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch strategy data
        run: python3 scripts/fetch_strategy_data.py
      - name: Commit if changed
        run: |
          git config user.name "strategy-bot"
          git config user.email "actions@users.noreply.github.com"
          git add strategy-data.json
          git diff --cached --quiet || git commit -m "data $(date -u '+%F %H:%M')"
          git push
