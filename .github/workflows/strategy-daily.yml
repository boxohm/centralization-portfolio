name: strategy-daily-data

on:
  schedule:
    - cron: "45 22 * * 1-5"   # 22:45 UTC weekdays, after US market close
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch strategy data
        run: python3 scripts/fetch_strategy_data.py
      - name: Commit if changed
        run: |
          git config user.name "strategy-bot"
          git config user.email "actions@users.noreply.github.com"
          git add strategy-data.json
          git diff --cached --quiet || git commit -m "daily data $(date -u +%F)"
          git push
